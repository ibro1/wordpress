name: Deploy WordPress themes and plugins

on:
  push:
    branches: [main]
    paths:
      - 'wp-content/themes/**'
      - 'wp-content/plugins/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            rm -rf /tmp/wp-deploy
            git clone --depth 1 https://github.com/ibro1/wordpress.git /tmp/wp-deploy

            docker exec wordpress_multisite_app rm -rf /var/www/html/wp-content/themes
            docker cp /tmp/wp-deploy/wp-content/themes wordpress_multisite_app:/var/www/html/wp-content/themes

            docker exec wordpress_multisite_app rm -rf /var/www/html/wp-content/plugins
            docker cp /tmp/wp-deploy/wp-content/plugins wordpress_multisite_app:/var/www/html/wp-content/plugins

            docker exec wordpress_multisite_app chown -R www-data:www-data /var/www/html/wp-content/themes /var/www/html/wp-content/plugins

            rm -rf /tmp/wp-deploy
            echo "Deployed all themes and plugins successfully"
