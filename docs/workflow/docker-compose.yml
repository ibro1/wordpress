services:
  wordpress:
    build:
      # Relative to this compose file's own location (docs/workflow/) -
      # repo root, so the Dockerfile's COPY paths can reach wp-content/.
      context: ../..
      dockerfile: docs/workflow/Dockerfile.wordpress
    restart: unless-stopped
    container_name: wordpress_multisite_app
    volumes:
      - wp_app:/var/www/html
    networks:
      - dokploy-network
      - default
    environment:
      MAIN_DOMAIN: ${MAIN_DOMAIN}
      WP_ALLOW_MULTISITE: ${WP_ALLOW_MULTISITE}
      NETWORK_ACTIVE: ${NETWORK_ACTIVE}
      WORDPRESS_DB_HOST: wp_db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG}
      WOOKIEE_API_INTERNAL_URL: ${WOOKIEE_API_INTERNAL_URL:-http://wookiee_api:3000}
      # Using $$ for PHP variables inside the Docker env string
      # ${MAIN_DOMAIN} here is substituted at compose-parse time by Dokploy
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_MEMORY_LIMIT', '512M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        define('DISALLOW_FILE_EDIT', true);

        # --- STAGE 2: unlocks Tools -> Network Setup menu ---
        if (getenv('WP_ALLOW_MULTISITE') === 'true') {
            define('WP_ALLOW_MULTISITE', true);
        }

        # --- STAGE 3: activates the network after Network Setup has run ---
        if (getenv('NETWORK_ACTIVE') === 'true') {
            define('MULTISITE', true);
            define('SUBDOMAIN_INSTALL', true);
            define('DOMAIN_CURRENT_SITE', '${MAIN_DOMAIN}');
            define('PATH_CURRENT_SITE', '/');
            define('SITE_ID_CURRENT_SITE', 1);
            define('BLOG_ID_CURRENT_SITE', 1);
        }

        # --- DYNAMIC COOKIE DOMAIN ---
        # Essential for logging into mapped domains like odehexecutive.com
        if (isset($$_SERVER['HTTP_HOST'])) {
            define('COOKIE_DOMAIN', $$_SERVER['HTTP_HOST']);
        }

        # --- INTERNAL API ROUTE ---
        # Reach the API container directly instead of out through Cloudflare,
        # whose 100s proxy ceiling turned a 109s image render into an HTTP 524
        # even though the image had generated fine. Both containers are on the
        # same network. The theme falls back to the public URL if this address
        # cannot be reached, so a wrong value degrades rather than breaks.
        if (getenv('WOOKIEE_API_INTERNAL_URL')) {
            define('WOOKIEE_API_INTERNAL_URL', getenv('WOOKIEE_API_INTERNAL_URL'));
        }

        # --- FORCE SSL ---
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            define('FORCE_SSL_ADMIN', true);
            define('FORCE_SSL_LOGIN', true);
            $$_SERVER['HTTPS'] = 'on';
        }

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"

      # --- Service Port ---
      - "traefik.http.services.wp-service.loadbalancer.server.port=80"

      # --- Router priorities ---
      # Stated rather than inherited. Traefik defaults a router's priority to
      # the LENGTH OF ITS RULE STRING, so without these the order depends on
      # how many characters each rule happens to contain - and adding the
      # EXCLUDED_DOMAINS negation to the wildcard lengthened it, raising its
      # priority, which is the opposite of what that change was for. Ordered
      # most specific to least: exact main domain, exact external hosts,
      # subdomain wildcard, then everything else.

      # --- Router 1: Main Domain (dynamic) ---
      - "traefik.http.routers.wp-main.rule=Host(`${MAIN_DOMAIN}`)"
      - "traefik.http.routers.wp-main.entrypoints=websecure"
      - "traefik.http.routers.wp-main.tls=true"
      - "traefik.http.routers.wp-main.service=wp-service"
      - "traefik.http.routers.wp-main.priority=100"

      # --- Router 2: Wildcard Subdomains (dynamic, based on MAIN_DOMAIN) ---
      # Matches site1.<MAIN_DOMAIN>, etc., MINUS anything named in
      # EXCLUDED_DOMAINS. Set that variable to hand a subdomain to something
      # other than this WordPress install, e.g.
      #     EXCLUDED_DOMAINS=Host(`deer.linkfa.de`) || Host(`shop.linkfa.de`)
      # It holds full Traefik rule syntax, same as EXTERNAL_DOMAINS below.
      # The .invalid default keeps the rule valid when nothing is excluded:
      # that TLD is reserved by RFC 2606 and can never resolve, so the
      # negation matches nothing and the router behaves as it always did.
      - "traefik.http.routers.wp-wildcard.rule=HostRegexp(`^.+\\.${MAIN_DOMAIN}$$`) && !(${EXCLUDED_DOMAINS:-Host(`excluded.invalid`)})"
      - "traefik.http.routers.wp-wildcard.entrypoints=websecure"
      - "traefik.http.routers.wp-wildcard.tls=true"
      - "traefik.http.routers.wp-wildcard.service=wp-service"
      - "traefik.http.routers.wp-wildcard.priority=50"

      # --- Router 3: External Domains (single dynamic rule, holds full Traefik rule syntax) ---
      # Keep this a list of EXACT hosts - Host(`a.com`) || Host(`b.com`).
      # It deliberately carries no EXCLUDED_DOMAINS negation, because an exact
      # host cannot over-reach. Put a wildcard or a HostRegexp in here and this
      # router will re-catch the very subdomains Router 2 was told to release,
      # with nothing in its rule to hint at why.
      - "traefik.http.routers.wp-ext.rule=${EXTERNAL_DOMAINS}"
      - "traefik.http.routers.wp-ext.entrypoints=websecure"
      - "traefik.http.routers.wp-ext.tls=true"
      - "traefik.http.routers.wp-ext.service=wp-service"
      - "traefik.http.routers.wp-ext.priority=90"

      # --- Router 4: Catch-All Fallback (Priority 1) ---
      # Catches any other domain pointed here, but might have SSL delay.
      # Carries the same EXCLUDED_DOMAINS negation as Router 2 - without it
      # this router simply re-catches whatever the wildcard just let go.
      - "traefik.http.routers.wp-catchall.rule=HostRegexp(`^.+$$`) && !(${EXCLUDED_DOMAINS:-Host(`excluded.invalid`)})"
      - "traefik.http.routers.wp-catchall.entrypoints=websecure"
      - "traefik.http.routers.wp-catchall.tls=true"
      # The only router that was not naming its service. Traefik falls back to
      # the container's single defined service, so it worked - but it worked by
      # inference, and it would stop the day a second service is defined here.
      - "traefik.http.routers.wp-catchall.service=wp-service"
      - "traefik.http.routers.wp-catchall.priority=1"

    entrypoint: |
      bash -c '
      # 1. FIX: Increase Upload Sizes to 512MB
      echo "file_uploads = On
      memory_limit = 512M
      upload_max_filesize = 512M
      post_max_size = 512M
      max_execution_time = 600" > /usr/local/etc/php/conf.d/uploads.ini

      # 2. FIX: Install PDO_MYSQL for Prime Mover (if missing)
      if ! php -m | grep -q "pdo_mysql"; then
         echo "PDO Extension missing. Installing..."
         docker-php-ext-install pdo pdo_mysql
      fi

      # 3. Merge themes/plugins baked into this image (see Dockerfile.wordpress)
      # onto the persistent volume, then fix permissions. rsync (no --delete)
      # adds/updates from git without removing anything installed directly
      # via wp-admin and never committed - a theme/plugin only goes away
      # here if it is also deleted from the git repo AND from the server.
      # Runs on every container start, but the Dockerfile COPY layers are
      # content-hash cached, so a fresh start only actually happens when
      # theme/plugin files changed in git - a no-op push reuses the
      # existing container.
      echo "Syncing themes/plugins from image..."
      mkdir -p /var/www/html/wp-content/themes /var/www/html/wp-content/plugins
      rsync -a /wp-content-deploy/themes/ /var/www/html/wp-content/themes/
      rsync -a /wp-content-deploy/plugins/ /var/www/html/wp-content/plugins/
      echo "Fixing permissions..."
      chown -R www-data:www-data /var/www/html/wp-content

      # 4. Standard Setup (MAIN_DOMAIN as real shell env var, runtime, single $)
      echo "ServerName $MAIN_DOMAIN" >> /etc/apache2/apache2.conf
      a2enmod rewrite

      sleep 5

      cat > /var/www/html/.htaccess << "EOF"
      RewriteEngine On
      RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
      RewriteBase /
      RewriteRule ^index\.php$$ - [L]
      RewriteRule ^wp-admin$$ wp-admin/ [R=301,L]
      RewriteCond %{REQUEST_FILENAME} -f [OR]
      RewriteCond %{REQUEST_FILENAME} -d
      RewriteRule ^ - [L]
      RewriteRule ^(wp-(content|admin|includes).*) $$1 [L]
      RewriteRule ^(.*\.php)$$ $$1 [L]
      RewriteRule . index.php [L]
      EOF
      chown www-data:www-data /var/www/html/.htaccess

      # Start Apache
      docker-entrypoint.sh apache2-foreground
      '
    depends_on:
      wp_db:
        condition: service_healthy

  wpcli:
    image: wordpress:cli
    container_name: wordpress_cli
    user: "33:33"
    volumes:
      - wp_app:/var/www/html
    networks:
      - default
    depends_on:
      - wp_db
    environment:
      WORDPRESS_DB_HOST: wp_db:3306
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_NAME}

  rembg:
    image: danielgatis/rembg:latest
    container_name: wookiee_rembg
    restart: unless-stopped
    command: ["s", "--host", "0.0.0.0", "--port", "7000"]
    networks:
      - default

  # Self-hosted Stable Diffusion, for licences whose package includes local
  # image models. CPU-only: see services/wookiee-sd/README.md for what that
  # costs in wall-clock time before promising it to a customer.
  wookiee_sd:
    build:
      context: ../../services/wookiee-sd
    container_name: wookiee_sd
    restart: unless-stopped
    volumes:
      # ~2GB per checkpoint, fetched on first use. On a named volume so a
      # rebuild of the image does not re-download 4GB of weights.
      - wookiee_sd_models:/models
    networks:
      # `default` only - never dokploy-network. This has no authentication of
      # its own; it must stay reachable from wookiee_api and nowhere else.
      - default
    environment:
      PORT: 7860
      HF_HOME: /models
      # Leave headroom on a shared box: inference will otherwise take every
      # core and starve PHP and MySQL while a rebrand is running.
      TORCH_THREADS: ${SD_TORCH_THREADS:-4}
      DREAMSHAPER_STEPS: ${SD_DREAMSHAPER_STEPS:-6}
      REALISTIC_VISION_STEPS: ${SD_REALISTIC_VISION_STEPS:-25}
    # Bounded so it cannot take the host down with it. A float32 SD1.5
    # pipeline is several GB resident, and a second one loading before the
    # first is released briefly holds both - on a box also running WordPress,
    # MySQL and the API, that is enough for the OOM killer to start choosing
    # victims, or for runc to fail forking a new container process entirely.
    # Hitting this limit kills only this container, which restarts.
    mem_limit: 12g
    memswap_limit: 12g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:7860/healthz')"]
      interval: 30s
      timeout: 10s
      # Generous: the first request loads ~2GB of weights from disk, and a
      # restart loop during that would mean it never finishes.
      start_period: 300s
      retries: 3

  claude_proxy:
    build: 
      context: ../../services/claude-proxy
    container_name: claude_proxy
    restart: unless-stopped
    networks:
      - default

  wookiee_api:
    build:
      # Relative to this compose file's own location (docs/workflow/), not
      # the repo root - two levels up, then into services/wookiee-api.
      context: ../../services/wookiee-api
    container_name: wookiee_api
    restart: unless-stopped
    volumes:
      - wookiee_api_data:/app/data
    networks:
      - dokploy-network
      - default
    environment:
      MASTER_KEY: ${WOOKIEE_API_MASTER_KEY}
      API_SHARED_SECRET: ${WOOKIEE_API_SHARED_SECRET}
      ADMIN_PASSWORD: ${WOOKIEE_API_ADMIN_PASSWORD}
      PORT: 3000
      LLM_CLAUDE_CODE_BASE_URL: ${LLM_CLAUDE_CODE_BASE_URL:-http://claude_proxy:8082/v1}
      # Optional - provider keys can be set here instead of through the
      # settings UI after deploy. Leave any of these unset/blank in your
      # Dokploy env config if you don't have that provider yet; the
      # settings UI can always fill it in (or override it) later.
      COMPANIES_HOUSE_API_KEY: ${COMPANIES_HOUSE_API_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL}
      CJ_EMAIL: ${CJ_EMAIL}
      CJ_API_KEY: ${CJ_API_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      REMBG_ENDPOINT_URL: ${REMBG_ENDPOINT_URL}
      # Points the image catalogue's `local` provider at the service above.
      # Unset it to hide the self-hosted models from the picker entirely.
      IMAGE_LOCAL_BASE_URL: ${IMAGE_LOCAL_BASE_URL:-http://wookiee_sd:7860/v1}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID}
      SPACESHIP_API_KEY: ${SPACESHIP_API_KEY}
      SPACESHIP_API_SECRET: ${SPACESHIP_API_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.wookiee-api-service.loadbalancer.server.port=3000"
      - "traefik.http.routers.wookiee-api.rule=Host(`api.${MAIN_DOMAIN}`)"
      - "traefik.http.routers.wookiee-api.entrypoints=websecure"
      - "traefik.http.routers.wookiee-api.tls=true"
      - "traefik.http.routers.wookiee-api.service=wookiee-api-service"
      # Without this, Traefik's default length-based priority sometimes lets
      # the WordPress multisite wildcard router (HostRegexp matching every
      # *.${MAIN_DOMAIN} subdomain, for mapped sites) win over this exact
      # host match, sending api.${MAIN_DOMAIN} into WordPress's
      # wp-signup.php instead of this service. Explicit priority forces the
      # specific match to always win regardless of rule-string length.
      - "traefik.http.routers.wookiee-api.priority=100"

  wp_db:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - default
    volumes:
      - wp_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wp_app:
  wp_data:
  wookiee_api_data:
  wookiee_sd_models:

networks:
  dokploy-network:
    external: true
